<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Election 2026 - Live Leader Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <header class="bg-red-800 border-b-4 border-yellow-500 p-4 sticky top-0 z-50 shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic">TN ELECTION 2026</h1>
                <p class="text-[10px] font-bold text-yellow-400 uppercase tracking-widest">Election Counting Center</p>
            </div>
            <div class="text-right">
                <span class="text-xs font-mono text-slate-400">NEXT AUTO-REFRESH: <span id="timer">120</span>s</span>
                <div class="text-xs text-green-400 font-bold uppercase" id="last-sync">Syncing...</div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 lg:p-8 max-w-6xl">
        
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mb-8">
            <h2 class="text-xl font-bold mb-4">Statewide Trends <span class="text-xs font-normal text-slate-500">(118 for Majority)</span></h2>
            <div class="w-full h-10 bg-slate-800 rounded-full flex overflow-hidden ring-4 ring-slate-950">
                <div id="bar-tvk" class="bg-yellow-500 transition-all duration-1000" style="width: 44%"></div>
                <div id="bar-aiadmk" class="bg-green-600 transition-all duration-1000" style="width: 32%"></div>
                <div id="bar-dmk" class="bg-red-600 transition-all duration-1000" style="width: 20%"></div>
                <div id="bar-others" class="bg-slate-500 transition-all duration-1000" style="width: 4%"></div>
            </div>
            <div class="grid grid-cols-4 mt-6 text-center gap-2">
                <div class="p-3 rounded-xl bg-yellow-500/10 border border-yellow-500/20"><p class="text-[10px] text-yellow-500 uppercase font-bold">TVK</p><p class="text-3xl font-black" id="stat-tvk">104</p></div>
                <div class="p-3 rounded-xl bg-green-500/10 border border-green-500/20"><p class="text-[10px] text-green-500 uppercase font-bold">AIADMK+</p><p class="text-3xl font-black" id="stat-aiadmk">76</p></div>
                <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/20"><p class="text-[10px] text-red-500 uppercase font-bold">DMK+</p><p class="text-3xl font-black" id="stat-dmk">47</p></div>
                <div class="p-3 rounded-xl bg-slate-500/10 border border-slate-500/20"><p class="text-[10px] text-slate-500 uppercase font-bold">Others</p><p class="text-3xl font-black" id="stat-others">7</p></div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 bg-slate-800/30">
                <h3 class="text-xl font-black text-white flex items-center gap-2 uppercase tracking-tight">
                    <span class="w-2 h-6 bg-yellow-500 rounded-full"></span> 
                    Key Leaders Tracker
                </h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-950 text-slate-500 text-[10px] uppercase tracking-widest">
                        <tr>
                            <th class="px-6 py-4">Leader Name</th>
                            <th class="px-6 py-4">Constituency</th>
                            <th class="px-6 py-4">Party</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Margin</th>
                        </tr>
                    </thead>
                    <tbody id="leaders-body" class="divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // DATA OBJECT - Update these values manually as results come in
        const stateData = { tvk: 104, aiadmk: 76, dmk: 47, others: 7 };

        const keyLeaders = [
            { name: "Vijay", const: "Perambur", party: "TVK", status: "WON", margin: "+24,300", color: "text-green-400" },
            { name: "M.K. Stalin", const: "Kolathur", party: "DMK", status: "Trailing", margin: "-5,800", color: "text-red-500" },
            { name: "E. Palaniswami", const: "Edappadi", party: "AIADMK", status: "WON", margin: "+12,100", color: "text-green-400" },
            { name: "Udhayanidhi Stalin", const: "Chepauk", party: "DMK", status: "Leading", margin: "+112", color: "text-green-500" },
            { name: "Seeman", const: "Karaikudi", party: "NTK", status: "Trailing", margin: "-11,500", color: "text-red-500" },
            { name: "Bussy Anand", const: "T. Nagar", party: "TVK", status: "Leading", margin: "+7,858", color: "text-green-500" },
            { name: "Premallatha V.", const: "Vriddhachalam", party: "DMDK", status: "Leading", margin: "+1,732", color: "text-green-500" },
            { name: "Senthil Balaji", const: "Coimbatore S", party: "DMK", status: "Leading", margin: "+1,400", color: "text-green-500" },
            { name: "Vanathi Srinivasan", const: "Coimbatore N", party: "BJP", status: "Trailing", margin: "-4,100", color: "text-red-500" },
            { name: "Duraimurugan", const: "Katpadi", party: "DMK", status: "Trailing", margin: "-7,200", color: "text-red-500" }
        ];

        function updateUI() {
            // Update Table
            const container = document.getElementById('leaders-body');
            container.innerHTML = keyLeaders.map(l => `
                <tr class="hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 font-bold text-sm">${l.name}</td>
                    <td class="px-6 py-4 text-slate-400 text-sm">${l.const}</td>
                    <td class="px-6 py-4 text-xs font-mono">${l.party}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded text-[10px] font-black uppercase ${l.status === 'WON' ? 'bg-green-500 text-white' : (l.status === 'Leading' ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500')}">${l.status}</span></td>
                    <td class="px-6 py-4 font-mono text-sm ${l.color}">${l.margin}</td>
                </tr>
            `).join('');

            // Update Progress Bars
            const total = 234;
            document.getElementById('bar-tvk').style.width = (stateData.tvk / total * 100) + '%';
            document.getElementById('bar-aiadmk').style.width = (stateData.aiadmk / total * 100) + '%';
            document.getElementById('bar-dmk').style.width = (stateData.dmk / total * 100) + '%';
            
            document.getElementById('last-sync').innerText = "Last Updated: " + new Date().toLocaleTimeString();
        }

        // Refresh Logic
        let seconds = 120;
        setInterval(() => {
            seconds--;
            document.getElementById('timer').innerText = seconds;
            if (seconds <= 0) {
                // To pull real data, you'd add a fetch() here. 
                // For now, it refreshes the existing UI state.
                updateUI();
                seconds = 120;
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
