<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Election 2026 - Master Map Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans">

    <header class="bg-red-800 border-b-4 border-yellow-500 p-4 sticky top-0 z-[1001] shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic uppercase">TN Election 2026 Dashboard</h1>
            <div class="text-right"><span class="text-[10px] text-slate-300">AUTO-REFRESH: <span id="timer">60</span>s</span></div>
        </div>
    </header>

    <main class="container mx-auto p-4 lg:p-8">
        <div id="error-banner" class="hidden bg-red-600 text-white font-bold p-4 rounded-xl mb-4 text-sm"></div>

        <div id="tab-container" class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-800">
            </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 relative bg-slate-900 rounded-3xl border border-slate-800 h-[600px] overflow-hidden shadow-2xl">
                <div id="map" class="h-full w-full"></div>
                <div class="absolute bottom-4 left-4 bg-slate-900/90 p-3 rounded-lg border border-slate-700 z-[1000] text-[10px] space-y-1">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-yellow-500"></span> TVK (Vijay)</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-green-600"></span> AIADMK+</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-600"></span> DMK+</div>
                </div>
            </div>

            <div id="sidebar" class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl flex flex-col justify-center">
                <h3 id="side-ac" class="text-yellow-500 font-black uppercase text-sm tracking-widest">Select a Region</h3>
                <div class="mt-4">
                    <p id="side-cand" class="text-2xl font-bold leading-tight">--</p>
                    <p id="side-party" class="text-xs font-mono text-slate-500 mt-1 italic">--</p>
                </div>
                <div class="mt-6 pt-6 border-t border-slate-800">
                    <span class="text-[10px] text-slate-500 uppercase font-bold">Margin / Difference</span>
                    <p id="side-margin" class="text-3xl font-black">0</p>
                    <p id="side-status" class="mt-2 inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-800">N/A</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let map, geoLayer, resultsData, districtData;

        async function init() {
            try {
                // 1. Fetch all local data files from your 'data' folder
                const [res1, res2, res3] = await Promise.all([
                    fetch('data/map_data.json').then(r => r.json()),
                    fetch('data/tn_districts.json').then(r => r.json()),
                    fetch('data/tn_assembly.json').then(r => r.json()) // Now using your local file
                ]);
                
                resultsData = res1;
                districtData = res2;
                const geoJson = res3;

                // 2. Initialize Map
                map = L.map('map', { zoomControl: false }).setView([11.1271, 78.6569], 7);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

                // 3. Render Tabs
                const tabContainer = document.getElementById('tab-container');
                Object.keys(districtData).forEach((dist, index) => {
                    const btn = document.createElement('button');
                    btn.className = `px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-slate-800 hover:bg-slate-800 transition ${index === 0 ? 'bg-yellow-500 text-black' : 'bg-slate-900 text-white'}`;
                    btn.innerText = dist;
                    btn.onclick = () => switchDistrict(dist, geoJson, btn);
                    tabContainer.appendChild(btn);
                });

                // 4. Initial view (Default to Chennai)
                switchDistrict("Chennai", geoJson, tabContainer.firstElementChild);

            } catch (error) {
                // If anything fails, show it on the screen!
                const banner = document.getElementById('error-banner');
                banner.classList.remove('hidden');
                banner.innerText = "Error loading data files: " + error.message + " | Please make sure map_data.json, tn_districts.json, and tn_assembly.json are inside the 'data' folder.";
                console.error(error);
            }
        }

        function switchDistrict(distName, fullGeo, btn) {
            // UI Update
            document.querySelectorAll('#tab-container button').forEach(b => b.className = b.className.replace('bg-yellow-500 text-black', 'bg-slate-900 text-white'));
            btn.className = btn.className.replace('bg-slate-900 text-white', 'bg-yellow-500 text-black');

            if (geoLayer) map.removeLayer(geoLayer);

            // Filter boundaries for the selected district
            const filtered = {
                type: "FeatureCollection",
                features: fullGeo.features.filter(f => {
                    // Check both lowercase and uppercase variations just in case!
                    const acName = f.properties.ac_name || f.properties.AC_NAME;
                    return districtData[distName].includes(acName);
                })
            };

            geoLayer = L.geoJson(filtered, {
                style: (f) => {
                    const acName = f.properties.ac_name || f.properties.AC_NAME;
                    return {
                        fillColor: getCol(resultsData[acName]?.party),
                        weight: 1, opacity: 1, color: '#0f172a', fillOpacity: 0.7
                    };
                },
                onEachFeature: (f, l) => {
                    l.on('mouseover', () => {
                        const acName = f.properties.ac_name || f.properties.AC_NAME;
                        updateSidebar(acName);
                        l.setStyle({ fillOpacity: 0.9, weight: 2, color: '#ffffff' });
                    });
                    l.on('mouseout', () => {
                        l.setStyle({ fillOpacity: 0.7, weight: 1, color: '#0f172a' });
                    });
                }
            }).addTo(map);
            
            // Zoom to fit the district
            map.fitBounds(geoLayer.getBounds());
        }

        function getCol(p) {
            return p === 'TVK' ? '#eab308' : p === 'AIADMK' ? '#16a34a' : p === 'DMK' ? '#ef4444' : '#334155';
        }

        function updateSidebar(ac) {
            const d = resultsData[ac] || { candidate: 'Pending', party: 'N/A', margin: '0', status: 'Counting' };
            document.getElementById('side-ac').innerText = ac;
            document.getElementById('side-cand').innerText = d.candidate;
            document.getElementById('side-party').innerText = d.party;
            document.getElementById('side-margin').innerText = d.margin;
            document.getElementById('side-margin').className = `text-3xl font-black ${d.margin.includes('-') ? 'text-red-500' : 'text-green-500'}`;
            document.getElementById('side-status').innerText = d.status;
        }

        // Timer Logic
        let sec = 60;
        setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = sec;
            if (sec <= 0) { location.reload(); }
        }, 1000);

        init();
    </script>
</body>
</html>
