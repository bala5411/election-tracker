<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Election 2026 - Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden">

    <header class="bg-gradient-to-r from-slate-900 to-slate-950 border-b-2 border-slate-800 p-4 sticky top-0 z-[1001] shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                <h1 class="text-2xl font-black tracking-tight uppercase"><span class="text-yellow-500">TN 2026</span> Live Tracker</h1>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 font-bold tracking-widest bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                    NEXT UPDATE: <span id="timer" class="text-white">60</span>s
                </span>
            </div>
        </div>
    </header>

    <section class="border-b border-slate-800 bg-slate-900/50">
        <div class="container mx-auto p-4 lg:p-6">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest">Statewide Total Leads</h2>
                <span class="text-[10px] text-slate-500 font-bold uppercase">Majority Mark: 118</span>
            </div>
            
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4" id="summary-tracker">
                </div>
            
            <div class="w-full h-1.5 bg-slate-800 rounded-full mt-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 h-full bg-slate-700 w-full"></div>
                <div class="absolute top-0 left-1/2 h-full w-0.5 bg-white z-10"></div>
                <div id="progress-tvk" class="absolute top-0 left-0 h-full bg-yellow-500 transition-all duration-1000 w-0"></div>
            </div>
        </div>
    </section>

    <main class="container mx-auto p-4 lg:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div class="lg:col-span-3 flex flex-col gap-4">
                <div id="tab-container" class="flex gap-2 overflow-x-auto pb-2 scroll-smooth">
                    </div>

                <div class="relative bg-slate-900 rounded-2xl border border-slate-800 h-[700px] overflow-hidden shadow-2xl flex-grow">
                    <div id="map" class="h-full w-full"></div>
                    
                    <div class="absolute bottom-4 left-4 glass-panel p-3 rounded-xl border border-slate-700 z-[1000] text-xs font-bold space-y-2 shadow-xl">
                        <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-sm bg-yellow-500"></span> TVK</div>
                        <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-sm bg-green-600"></span> AIADMK+</div>
                        <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-sm bg-red-600"></span> DMK+</div>
                        <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-sm bg-red-900"></span> NTK</div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-6">
                
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-2xl border border-slate-700 shadow-xl">
                    <h3 id="side-ac" class="text-yellow-500 font-black uppercase text-xs tracking-widest border-b border-slate-700 pb-2 mb-3">Hover over map</h3>
                    <div>
                        <p id="side-cand" class="text-xl font-bold leading-tight">--</p>
                        <p id="side-party" class="text-xs font-mono text-slate-400 mt-1 uppercase">--</p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-end">
                        <div>
                            <span class="text-[10px] text-slate-500 uppercase font-bold block mb-1">Margin</span>
                            <p id="side-margin" class="text-2xl font-black">0</p>
                        </div>
                        <p id="side-status" class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-slate-950 text-slate-300 border border-slate-800">N/A</p>
                    </div>
                </div>

                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 shadow-xl">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Lead / Win Breakdown
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="text-[9px] text-slate-500 uppercase border-b border-slate-800">
                                <tr>
                                    <th class="pb-2">Party</th>
                                    <th class="pb-2 text-right">Lead</th>
                                    <th class="pb-2 text-right">Won</th>
                                    <th class="pb-2 text-right text-yellow-500">Total</th>
                                </tr>
                            </thead>
                            <tbody id="summary-table-body" class="divide-y divide-slate-800/50">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 shadow-xl flex-grow">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                        Key Leaders
                    </h3>
                    <div id="vip-tracker" class="space-y-3">
                        </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        let map, geoLayer, resultsData, districtData;

        // Added NTK (Dark Red) to the party colors
        const partyColors = {
            'TVK': '#eab308', 'AIADMK': '#16a34a', 'DMK': '#ef4444', 
            'BJP': '#f97316', 'INC': '#06b6d4', 'NTK': '#7f1d1d', 'OTH': '#64748b'
        };

        // Your requested 5 Party Leaders
       // Your requested 5 Party Leaders (Matched to GeoJSON spellings)
        const vipList = [
            { ac: 'Perambur', name: 'Vijay' },                 
            { ac: 'Kolathur', name: 'M.K. Stalin' },           
            { ac: 'Edappadi', name: 'E. Palaniswami' },        
            { ac: 'Chepauk-Thiruvalliken', name: 'Udhayanidhi Stalin' }, // Notice the missing 'i'
            { ac: 'Tiruvottiyur', name: 'Seeman' }                       // Notice the missing 'h'
        ];

        async function init() {
            try {
                const cacheBuster = '?v=' + Date.now();
                const [res1, res2, res3] = await Promise.all([
                    fetch('data/map_data.json' + cacheBuster).then(r => r.json()),
                    fetch('data/tn_districts.json' + cacheBuster).then(r => r.json()),
                    fetch('data/tn_assembly.json' + cacheBuster).then(r => r.json()) 
                ]);
                
                resultsData = {};
                for (let key in res1) {
                    resultsData[key.trim().toLowerCase()] = res1[key];
                    resultsData[key.trim().toLowerCase()].originalName = key; 
                }
                
                districtData = res2;
                const geoJson = res3;

                // Build all dashboard widgets
                buildSummaryTracker();
                buildSummaryTable(); // NEW TABLE FUNCTION
                buildVIPTracker();
                initMap(geoJson);

            } catch (error) {
                console.error("Dashboard Loading Error:", error);
                document.getElementById('side-ac').innerText = "SYSTEM ERROR";
                document.getElementById('side-cand').innerText = "Data Sync Failed";
            }
        }

        // --- MAP LOGIC ---
        function initMap(geoJson) {
            map = L.map('map', { zoomControl: false, scrollWheelZoom: false }).setView([11.1271, 78.6569], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            const tabContainer = document.getElementById('tab-container');
            const stateBtn = document.createElement('button');
            stateBtn.className = `px-5 py-2 rounded-lg text-xs font-bold whitespace-nowrap border border-slate-700 bg-yellow-500 text-black shadow-lg`;
            stateBtn.innerText = "Statewide View";
            stateBtn.onclick = () => showStatewide(geoJson, stateBtn);
            tabContainer.appendChild(stateBtn);

            Object.keys(districtData).forEach((dist) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap border border-slate-800 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white transition`;
                btn.innerText = dist;
                btn.onclick = () => switchDistrict(dist, geoJson, btn);
                tabContainer.appendChild(btn);
            });

            showStatewide(geoJson, stateBtn);
        }

        function showStatewide(fullGeo, btn) {
            updateTabStyling(btn);
            renderGeoJson(fullGeo.features);
            map.setView([11.1271, 78.6569], 7);
        }

        function switchDistrict(distName, fullGeo, btn) {
            updateTabStyling(btn);
            const targetConstituencies = districtData[distName].map(name => name.trim().toLowerCase());
            const filteredFeatures = fullGeo.features.filter(f => {
                const acName = (f.properties.ac_name || f.properties.AC_NAME || "").trim().toLowerCase();
                return targetConstituencies.includes(acName);
            });
            renderGeoJson(filteredFeatures);
        }

        function renderGeoJson(features) {
            if (geoLayer) map.removeLayer(geoLayer);
            const filtered = { type: "FeatureCollection", features: features };

            geoLayer = L.geoJson(filtered, {
                style: (f) => {
                    const acName = (f.properties.ac_name || f.properties.AC_NAME || "").trim().toLowerCase();
                    const partyData = resultsData[acName];
                    const pColor = partyData ? (partyColors[partyData.party] || partyColors['OTH']) : '#1e293b';
                    return { fillColor: pColor, weight: 1, opacity: 1, color: '#020617', fillOpacity: 0.85 };
                },
                onEachFeature: (f, l) => {
                    l.on('mouseover', () => {
                        const rawName = f.properties.ac_name || f.properties.AC_NAME;
                        updateSidebar(rawName);
                        l.setStyle({ fillOpacity: 1, weight: 2, color: '#ffffff' });
                        l.bringToFront();
                    });
                    l.on('mouseout', () => { geoLayer.resetStyle(l); });
                }
            }).addTo(map);
            
            if(features.length < 50) map.fitBounds(geoLayer.getBounds(), {padding: [20,20]});
        }

        function updateTabStyling(activeBtn) {
            document.querySelectorAll('#tab-container button').forEach(b => {
                b.className = b.className.replace('bg-yellow-500 text-black', 'bg-slate-900 text-slate-300').replace('shadow-lg', '');
            });
            activeBtn.className = activeBtn.className.replace('bg-slate-900 text-slate-300', 'bg-yellow-500 text-black shadow-lg');
        }

        function updateSidebar(rawAcName) {
            const searchKey = rawAcName.trim().toLowerCase();
            const d = resultsData[searchKey] || { candidate: 'Awaiting Data', party: 'N/A', margin: '0', status: 'Counting' };
            const pColor = partyColors[d.party] || partyColors['OTH'];

            document.getElementById('side-ac').innerText = rawAcName;
            document.getElementById('side-cand').innerText = d.candidate;
            document.getElementById('side-party').innerText = d.party;
            document.getElementById('side-party').style.color = pColor;
            
            const marginEl = document.getElementById('side-margin');
            marginEl.innerText = d.margin;
            marginEl.className = `text-3xl font-black ${String(d.margin).includes('-') ? 'text-red-500' : 'text-white'}`;
            
            const statusEl = document.getElementById('side-status');
            statusEl.innerText = d.status;
            statusEl.className = `px-2 py-1 rounded text-[10px] font-bold uppercase ${d.status === 'WON' ? 'bg-green-500/20 text-green-400 border border-green-500' : 'bg-slate-950 text-slate-300 border border-slate-800'}`;
        }

        // --- DASHBOARD TRACKERS LOGIC ---

        function buildSummaryTracker() {
            const counts = { TVK: 0, DMK: 0, AIADMK: 0, BJP: 0, NTK: 0, OTH: 0 };
            
            Object.values(resultsData).forEach(seat => {
                if(counts[seat.party] !== undefined) counts[seat.party]++;
                else counts['OTH']++;
            });

            const container = document.getElementById('summary-tracker');
            container.innerHTML = ''; 

            const sortedParties = Object.entries(counts).sort((a,b) => b[1] - a[1]);

            sortedParties.forEach(([party, count]) => {
                if(count === 0 && !['TVK', 'DMK', 'AIADMK'].includes(party)) return; 
                
                const color = partyColors[party] || partyColors['OTH'];
                const card = `
                    <div class="bg-slate-950 rounded-xl border border-slate-800 p-3 flex flex-col items-center justify-center relative overflow-hidden">
                        <div class="absolute bottom-0 left-0 w-full h-1" style="background-color: ${color}"></div>
                        <span class="text-xs font-bold text-slate-400 mb-1">${party}</span>
                        <span class="text-3xl font-black" style="color: ${color}">${count}</span>
                    </div>
                `;
                container.innerHTML += card;
            });

            const leadingPartyCount = counts['TVK']; 
            const percentage = Math.min((leadingPartyCount / 234) * 100, 100);
            document.getElementById('progress-tvk').style.width = `${percentage}%`;
        }

        // NEW: Detailed Lead vs Won Table Generator
        function buildSummaryTable() {
            const stats = {};
            
            Object.values(resultsData).forEach(seat => {
                const p = seat.party;
                if (!stats[p]) stats[p] = { lead: 0, won: 0, total: 0 };
                
                if (seat.status.toUpperCase() === 'WON') stats[p].won++;
                else stats[p].lead++;
                
                stats[p].total++;
            });

            const sortedStats = Object.entries(stats).sort((a,b) => b[1].total - a[1].total);
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';

            sortedStats.forEach(([party, data]) => {
                if(data.total === 0) return;
                const pColor = partyColors[party] || partyColors['OTH'];
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="py-2.5 font-bold flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-sm" style="background: ${pColor}"></span>
                            ${party}
                        </td>
                        <td class="py-2.5 text-right text-slate-300">${data.lead}</td>
                        <td class="py-2.5 text-right text-green-400 font-bold">${data.won}</td>
                        <td class="py-2.5 text-right font-black text-white">${data.total}</td>
                    </tr>
                `;
            });
        }

        function buildVIPTracker() {
            const container = document.getElementById('vip-tracker');
            container.innerHTML = '';

            vipList.forEach(vip => {
                const searchKey = vip.ac.trim().toLowerCase();
                const d = resultsData[searchKey] || { party: 'N/A', margin: '0', status: 'Counting' };
                const isLeading = !String(d.margin).includes('-');
                const marginColor = isLeading ? 'text-green-400' : 'text-red-500';
                const pColor = partyColors[d.party] || partyColors['OTH'];

                const html = `
                    <div class="p-3 bg-slate-950 rounded-lg border border-slate-800 hover:border-slate-600 transition group">
                        <div class="flex justify-between items-start mb-1">
                            <div>
                                <h4 class="font-bold text-sm text-white group-hover:text-yellow-500 transition">${vip.name}</h4>
                                <span class="text-[10px] text-slate-500 uppercase">${vip.ac}</span>
                            </div>
                            <span class="px-1.5 py-0.5 rounded bg-slate-900 text-[9px] font-bold border border-slate-700" style="color: ${pColor}">${d.party}</span>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs font-bold ${marginColor}">${d.margin}</span>
                            <span class="text-[9px] uppercase tracking-wider text-slate-400">${d.status}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Auto-Refresh Timer
        let sec = 60;
        setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = sec;
            if (sec <= 0) { location.reload(); }
        }, 1000);

        init();
    </script>
</body>
</html>
