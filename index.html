<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN 2026 - Live Counting Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <header class="bg-red-800 border-b-4 border-yellow-500 p-4 sticky top-0 z-50 shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight italic">TN ELECTION 2026</h1>
                <p class="text-xs font-bold text-yellow-400 uppercase tracking-widest">Live Counting Results</p>
            </div>
            <div class="text-right">
                <div class="flex items-center gap-2 justify-end">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span id="last-update" class="text-sm font-mono text-slate-300">Syncing...</span>
                </div>
                <p class="text-[10px] text-slate-400 uppercase">Next refresh in: <span id="timer">120</span>s</p>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-5xl">
        
        <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8 shadow-inner">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <span class="text-3xl font-black text-yellow-500" id="tvk-total">110</span>
                    <span class="text-slate-500 ml-2">/ 234 Seats</span>
                </div>
                <div class="text-right hidden md:block">
                    <span class="text-sm font-bold text-slate-400">MAJORITY MARK: 118</span>
                </div>
            </div>
            <div class="w-full h-6 bg-slate-800 rounded-full flex overflow-hidden ring-4 ring-slate-950">
                <div id="bar-tvk" class="bg-yellow-500 transition-all duration-1000 ease-out" style="width: 47%"></div>
                <div id="bar-aiadmk" class="bg-green-600 transition-all duration-1000 ease-out" style="width: 29%"></div>
                <div id="bar-dmk" class="bg-red-600 transition-all duration-1000 ease-out" style="width: 20%"></div>
            </div>
            <div class="flex justify-between text-[10px] mt-2 font-bold text-slate-500 uppercase">
                <span>TVK (Vijay)</span>
                <span>AIADMK+</span>
                <span>DMK+</span>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <table class="w-full">
                    <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase text-left">
                        <tr>
                            <th class="p-4">Party</th>
                            <th class="p-4">Lead</th>
                            <th class="p-4 text-green-400">Won</th>
                            <th class="p-4 text-white">Total</th>
                        </tr>
                    </thead>
                    <tbody id="results-body" class="divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>

            <div class="space-y-4">
                <div class="bg-blue-600/10 border border-blue-500/30 p-4 rounded-xl">
                    <h4 class="text-blue-400 text-xs font-bold mb-1 italic uppercase">Live Comment</h4>
                    <p class="text-sm leading-relaxed" id="commentary">Loading latest trends from ECI...</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <h4 class="text-slate-500 text-xs font-bold mb-2 uppercase">Official Turnout</h4>
                    <div class="text-3xl font-black text-white">85.10%</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // DATA MODEL
        let electionData = {
            tvk: { leads: 96, won: 14, color: 'text-yellow-500' },
            aiadmk: { leads: 58, won: 9, color: 'text-green-500' },
            dmk: { leads: 45, won: 5, color: 'text-red-500' },
            others: { leads: 7, won: 0, color: 'text-slate-400' }
        };

        function updateUI() {
            // Update Table
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = `
                <tr>
                    <td class="p-4 font-bold text-yellow-500">TVK (Vijay)</td>
                    <td class="p-4">${electionData.tvk.leads}</td>
                    <td class="p-4 text-green-400 font-bold">${electionData.tvk.won}</td>
                    <td class="p-4 font-black">${electionData.tvk.leads + electionData.tvk.won}</td>
                </tr>
                <tr>
                    <td class="p-4 font-bold text-green-500">AIADMK+</td>
                    <td class="p-4">${electionData.aiadmk.leads}</td>
                    <td class="p-4 text-green-400 font-bold">${electionData.aiadmk.won}</td>
                    <td class="p-4 font-black">${electionData.aiadmk.leads + electionData.aiadmk.won}</td>
                </tr>
                <tr>
                    <td class="p-4 font-bold text-red-500">DMK+</td>
                    <td class="p-4">${electionData.dmk.leads}</td>
                    <td class="p-4 text-green-400 font-bold">${electionData.dmk.won}</td>
                    <td class="p-4 font-black">${electionData.dmk.leads + electionData.dmk.won}</td>
                </tr>
            `;

            // Update Progress Bar
            document.getElementById('tvk-total').innerText = electionData.tvk.leads + electionData.tvk.won;
            document.getElementById('bar-tvk').style.width = ((electionData.tvk.leads + electionData.tvk.won) / 234 * 100) + '%';
            
            // Update Timestamp
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
        }

        // SIMULATED LIVE FETCH (Replace this with real API call)
        function fetchLiveResults() {
            console.log("Fetching latest data...");
            // In a real app, you would use: fetch('api-url').then(...)
            // Here, we simulate a small shift in leads to won
            if(electionData.tvk.leads > 0) {
                electionData.tvk.leads -= 1;
                electionData.tvk.won += 1;
                document.getElementById('commentary').innerText = "TVK picks up another confirmed seat in the Northern belt. Momentum holding.";
            }
            updateUI();
        }

        // AUTO-REFRESH LOGIC
        let timeLeft = 120;
        setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                fetchLiveResults();
                timeLeft = 120; // Reset
            }
        }, 1000);

        // Initial Run
        updateUI();
    </script>
</body>
</html>
