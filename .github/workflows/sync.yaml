name: Election Data Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# THIS IS THE FIX FOR ERROR 128: Grants the bot permission to save the file
permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Updated to v4 to fix the yellow warning

      - name: Setup Python
        uses: actions/setup-python@v5  # Updated to v5 to fix the yellow warning
        with:
          python-version: '3.9'

      - name: Install Tools
        run: pip install pandas requests lxml html5lib beautifulsoup4

      - name: Scrape Data
        run: python scraper.py

      - name: Commit & Push
        run: |
          git config --global user.name 'ElectionBot'
          git config --global user.email 'bot@github.com'
          git add data/map_data.json
          git commit -m "Live Update: $(date)" || exit 0
          git push
